<title>Caja FNTSMG-1</title>
<meta name="description" content="El firmware FNTSMG-1 0.10 corriendo en tu navegador: el mismo código del FM-1, con su pantalla, sus luces y su sonido.">

<style>
/* La caja es el FM-1 mismo: el firmware 0.10 compilado para el navegador. La página solo pone el aparato
   (la geometría del render real, igual que la guía), le pasa los dedos y dibuja lo que el firmware manda:
   pantalla por bandas y luces. Piel de la guía: papel y tinta, de noche hueso sobre negro, solo Manrope. */
:root{
  --bg:#F8F6F2; --pa:#EFEDE8; --ink:#0A0A0A; --ink2:#666660; --ink3:#97948B;
  --tint:rgba(10,10,10,.05); --tint2:rgba(10,10,10,.09); --acc:#0A0A0A; --red:#D6402E;
  --d-body:#585652; --d-edge:#46443F; --d-panel:#2B2B2C; --d-ctl:#3B3B3D; --d-ctl-hi:#55555A; --d-lab:#C9C4BA;
  --d-kb:#4D4140; --d-kup:#3B3132; --d-kdn:#6C5C5B; --d-slot:#8E7E7C; --d-knob:#2A2926; --d-knurl:#5A5752; --d-ind:#E4DED2;
  --d-hi:#F2EEE4; --d-hi-ink:#0B0B0A; --d-ring:#F2EEE4;
  --f:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0B0A; --pa:#161614; --ink:#F2EEE4; --ink2:#B3AEA4; --ink3:#7D7A73;
  --tint:rgba(242,238,228,.05); --tint2:rgba(242,238,228,.09); --acc:#F2EEE4; --red:#E2513E;
  --d-body:#4A4844; --d-edge:#383633; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0B0A; --pa:#161614; --ink:#F2EEE4; --ink2:#B3AEA4; --ink3:#7D7A73;
  --tint:rgba(242,238,228,.05); --tint2:rgba(242,238,228,.09); --acc:#F2EEE4; --red:#E2513E;
  --d-body:#4A4844; --d-edge:#383633; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.55 var(--f);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
p,h1,h2,h3{margin:0}
button,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-block:0 72px;display:grid;gap:24px}
.wrap > *{min-width:0}

/* barra */
.top{position:sticky;top:0;z-index:6;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;
  background:color-mix(in srgb,var(--bg) 94%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none}
.brand b{font:800 18px/1 var(--f);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.brand b::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--red)}
.brand span{font:200 17px/1 var(--f);white-space:nowrap}
.right{display:flex;gap:8px;align-items:center}
.links{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--tint)}
.links a{display:inline-flex;align-items:center;height:32px;padding:0 14px;border-radius:999px;font:600 13.5px/1 var(--f);color:var(--ink2);text-decoration:none;white-space:nowrap}
.links a:hover{background:var(--tint2);color:var(--ink)}
.pill{height:36px;border:0;border-radius:999px;background:var(--tint);padding:0 12px;font:700 12.5px/1 var(--f);letter-spacing:.06em;color:var(--ink2);cursor:pointer}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:999px;border:0;background:var(--tint);cursor:pointer;color:var(--ink2);flex:none}
.iconbtn svg{width:17px;height:17px}
@media (max-width:760px){.links{display:none}.brand span{display:none}}

/* encabezado */
.intro{display:grid;gap:10px;padding-top:4px}
.intro h1{font:800 clamp(34px,5.4vw,60px)/1 var(--f);letter-spacing:-.03em;text-wrap:balance}
.intro h1 span{font-weight:200;letter-spacing:-.02em}
.intro p{max-width:62ch;color:var(--ink2);font-size:16px}

/* el aparato */
.stage{background:var(--pa);border-radius:22px;padding:clamp(12px,2.4vw,28px);display:grid;gap:14px}
.devwrap{position:relative;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.devwrap canvas{position:absolute;pointer-events:none;image-rendering:pixelated;border-radius:2px}
.power{position:absolute;display:grid;place-items:center;align-content:center;gap:8px;border:0;border-radius:4px;background:#0B0B0A;color:#F2EEE4;cursor:pointer;
  font:800 clamp(9px,1.5vw,13px)/1.2 var(--f);letter-spacing:.12em;text-transform:uppercase;padding:6px}
.power svg{width:clamp(22px,4vw,40px);height:clamp(22px,4vw,40px)}
.power:hover svg{transform:scale(1.06)}
.state{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;color:var(--ink3);font:600 12.5px/1.3 var(--f)}
.state .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ink3);margin-right:7px;vertical-align:1px}
.state .dot.on{background:var(--red)}
.state button{border:0;background:none;padding:0;color:var(--ink3);font:600 12.5px/1.3 var(--f);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.rot{display:none;color:var(--ink2);font-size:14px}
@media (max-width:560px) and (orientation:portrait){.rot{display:block}}

svg.dev{display:block;width:100%;height:auto}
.dev text{font-family:var(--f);font-weight:800;pointer-events:none}
.dev .body{fill:var(--d-body);stroke:var(--d-edge);stroke-width:1.5}
.dev .pnl{fill:var(--d-panel)}
.dev .kbp{fill:var(--d-kb)}
.dev .bez{fill:#151514}
.dev .dot{fill:#211A1A}
.dev .lbl{fill:var(--d-lab);font-size:8.6px;letter-spacing:.06em}
.dev .ctl{cursor:pointer}
.dev .btn rect{fill:var(--d-ctl);stroke:#232324;stroke-width:1;transition:fill .06s}
.dev .btn text{fill:var(--d-lab);font-size:7.6px;letter-spacing:.04em}
.dev .btn.half rect{fill:var(--d-ctl-hi)}
.dev .btn.on rect{fill:var(--d-hi)}
.dev .btn.on text{fill:var(--d-hi-ink)}
.dev .knob .kr{fill:var(--d-knurl)}
.dev .knob .kc{fill:var(--d-knob)}
.dev .knob line{stroke:var(--d-ind);stroke-width:2.2;stroke-linecap:round}
.dev .knob .hit{fill:transparent}
.dev .key rect{stroke:#2A2222;stroke-width:1}
.dev .key.up rect{fill:var(--d-kup)}
.dev .key.dn rect{fill:var(--d-kdn)}
.dev .key .slot{stroke:var(--d-slot);stroke-width:2.4;stroke-linecap:round;opacity:.45;transition:opacity .06s}
.dev .key.on .slot{stroke:var(--d-hi);opacity:1}
.dev .key text{fill:var(--d-lab);font-size:7.4px}
.dev .key.dn text{fill:#EFE7E3}
.dev .down rect,.dev .down .kr{stroke:var(--d-ring);stroke-width:2}
.dev .latch rect{stroke:var(--red);stroke-width:2.4}
.dev .ctl:hover rect,.dev .ctl:hover .kr{stroke:var(--d-ring);stroke-width:1.6}

/* cómo se toca aquí */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:980px){.how{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.how{grid-template-columns:minmax(0,1fr)}}
.how article{background:var(--pa);border-radius:18px;padding:18px;display:grid;gap:8px;align-content:start}
.how svg{width:26px;height:26px;color:var(--ink)}
.how h3{font:800 12px/1.3 var(--f);letter-spacing:.12em;text-transform:uppercase}
.how p{color:var(--ink2);font-size:14.5px}
.how kbd{font:700 12px/1 var(--f);padding:3px 6px;border-radius:6px;background:var(--tint2);color:var(--ink)}
.foot{display:flex;gap:10px 20px;flex-wrap:wrap;color:var(--ink3);font-size:13.5px}
.foot a{color:var(--ink2)}
</style>

  s += `<rect class="body" x=".75" y=".75" width="638.5" height="364.5" rx="22"/>`;
  s += `<rect class="pnl" x="25" y="154" width="103" height="31" rx="7"/><rect class="pnl" x="341" y="93" width="263" height="91" rx="10"/>`;
  s += `<rect class="bez" x="159" y="16" width="155" height="153" rx="16"/><rect class="kbp" x="7.5" y="207.5" width="621.5" height="148.5" rx="24"/>`;
  [168.5, 281.5, 431, 544].forEach((x) => s += `<circle class="dot" cx="${x}" cy="280.5" r="2"/>`);
  for (const c of CT) {
    const at = ` data-id="${c.id}" tabindex="0" role="button" aria-label="${esc(c.l)}"`;
    if (c.t === 'kn') {
      s += `<g class="ctl knob"${at}><circle class="hit" cx="${c.x}" cy="${c.y}" r="22"/><circle class="kr" cx="${c.x}" cy="${c.y}" r="15.5"/><circle class="kc" cx="${c.x}" cy="${c.y}" r="12.5"/>` +
        `<g class="ind" style="transform-origin:${c.x}px ${c.y}px"><line x1="${c.x}" y1="${c.y - 4}" x2="${c.x}" y2="${c.y - 11}"/></g><text class="lbl" x="${c.x}" y="${c.y - 24}" text-anchor="middle">${esc(c.l)}</text></g>`;
    } else if (c.t === 'bt') {
      s += `<g class="ctl btn"${at}><rect x="${c.x}" y="${c.y}" width="${c.w}" height="${c.h}" rx="7"/><text x="${c.x + c.w / 2}" y="${c.y + c.h / 2 + 2.8}" text-anchor="middle">${esc(c.l)}</text></g>`;
    } else {
      const r = c.w / 2, long = c.l.length > 2;
      s += `<g class="ctl key ${c.t}"${at}><rect x="${c.x}" y="${c.y}" width="${c.w}" height="${c.h}" rx="${r}"/><line class="slot" x1="${c.x + r}" y1="${c.y + 11}" x2="${c.x + r}" y2="${c.y + c.h - 26}"/>` +
        `<text x="${c.x + r}" y="${c.y + c.h - 10}" text-anchor="middle"${long ? ' font-size="6.2"' : ''}>${esc(c.l)}</text></g>`;
    }
  }
  return s + `</svg>`;
}
$('devwrap').insertAdjacentHTML('afterbegin', deviceSVG());
const dev = $('dev'), scr = $('scr'), power = $('power');
const EL = {}; dev.querySelectorAll('[data-id]').forEach((g) => EL[g.dataset.id] = g);
function place() {                                                  // la pantalla y el botón de encender sobre el bisel
  const k = dev.getBoundingClientRect().width / 640, css = `left:${SCR.x * k}px;top:${SCR.y * k}px;width:${SCR.s * k}px;height:${SCR.s * k}px`;
  scr.style.cssText = css; power.style.cssText = css;
}
new ResizeObserver(place).observe(dev); place();

/* ---------- audio: el firmware en un AudioWorklet ---------- */
const SKEY = 'fntsmg1-caja-v1';
let ctx = null, node = null, gain = null, vol = 0.8, on = false, playing = false;
function slotsGuardados() {
  const o = {};
  try { const j = JSON.parse(localStorage.getItem(SKEY) || '{}'); for (const k in j) o[k] = Uint8Array.from(atob(j[k]), (c) => c.charCodeAt(0)); } catch (e) {}
  return o;
}
function guardarSlots(sl) {
  try {
    const j = JSON.parse(localStorage.getItem(SKEY) || '{}');
    for (const k in sl) { const b = sl[k]; if (!b.length) { delete j[k]; continue; } let s = ''; for (let i = 0; i < b.length; i++) s += String.fromCharCode(b[i]); j[k] = btoa(s); }
    localStorage.setItem(SKEY, JSON.stringify(j));
  } catch (e) {}
}
const sctx = scr.getContext('2d'), img = sctx.createImageData(240, 16);
function pintarBanda(y, px) {
  const d = img.data;
  for (let i = 0; i < px.length; i++) {
    const v = ((px[i] >> 8) | (px[i] << 8)) & 0xffff, o = i * 4;
    d[o] = (v >> 11) << 3; d[o + 1] = ((v >> 5) & 63) << 2; d[o + 2] = (v & 31) << 3; d[o + 3] = 255;
  }
  sctx.putImageData(img, 0, y);
}
function luces(bt, ky, half) {
  for (const id in FB) { const g = EL[id], b = FB[id]; g.classList.toggle('on', !!(bt >>> b & 1)); g.classList.toggle('half', !(bt >>> b & 1) && !!(half >>> b & 1)); }
  for (let i = 0; i < 16; i++) EL['w' + i].classList.toggle('on', !!(ky >>> W2K[i] & 1));
  for (let i = 0; i < 11; i++) EL['b' + i].classList.toggle('on', !!(ky >>> B2K[i] & 1));
  const p = !!(bt >>> FB.play & 1); if (p !== playing) { playing = p; estado(); }
}
async function encender() {
  if (on) return;
  power.disabled = true;
  try {
    ctx = new AudioContext({ sampleRate: 44100, latencyHint: 'interactive' });
    const [wasm] = await Promise.all([fetch('fntsmg1.wasm').then((r) => r.arrayBuffer()), ctx.audioWorklet.addModule('worklet.js')]);
    node = new AudioWorkletNode(ctx, 'caja-fntsmg1', { numberOfInputs: 0, outputChannelCount: [2] });
    gain = ctx.createGain(); gain.gain.value = vol; node.connect(gain).connect(ctx.destination);
    node.port.onmessage = (e) => {
      const m = e.data;
      if (m.t === 'f') { for (const [y, px] of m.bands) pintarBanda(y, px); luces(m.bt, m.ky, m.half); if (m.slots) guardarSlots(m.slots); }
      else if (m.t === 'listo') { on = true; power.hidden = true; estado(); }
    };
    node.port.postMessage({ t: 'init', wasm, seed: (Math.random() * 2 ** 32) >>> 0, slots: slotsGuardados() });
    await ctx.resume();
  } catch (err) {
    console.error(err); power.disabled = false;
  }
}
power.addEventListener('click', encender);
function estado() {
  $('dot').classList.toggle('on', on && playing);
  $('stTxt').textContent = !on ? t('apagado') : playing ? t('sonando') : t('parado');
}
$('borrar').addEventListener('click', () => { if (!confirm(t('borrarQ'))) return; try { localStorage.removeItem(SKEY); } catch (e) {} location.reload(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && node) node.port.postMessage({ t: 'repaint' }); });

/* ---------- los dedos ---------- */
const send = (m) => { if (node && on) node.port.postMessage(m); };
function press(id, d) {
  if (id in FB) send({ t: 'btn', id: FB[id], d });
  else if (id[0] === 'w') send({ t: 'key', k: W2K[+id.slice(1)], d });
  else if (id[0] === 'b') send({ t: 'key', k: B2K[+id.slice(1)], d });
  EL[id].classList.toggle('down', !!d);
}
const ang = {};
function turn(id, steps) {
  if (!steps) return;
  ang[id] = (ang[id] || 0) + steps * (id === 'master' ? 6 : 15);
  if (id === 'master') { ang[id] = Math.max(-150, Math.min(150, ang[id])); vol = (ang[id] + 150) / 300 * 1.2; if (gain) gain.gain.setTargetAtTime(vol, ctx.currentTime, .02); }
  else send({ t: 'enc', r: ENC[id], s: steps });
  EL[id].querySelector('.ind').style.transform = `rotate(${ang[id]}deg)`;
}
ang.master = (0.8 / 1.2) * 300 - 150; EL.master.querySelector('.ind').style.transform = `rotate(${ang.master}deg)`;
const latched = new Set(), drags = new Map();
dev.addEventListener('pointerdown', (e) => {
  const g = e.target.closest('[data-id]'); if (!g) return;
  e.preventDefault(); if (!on) encender();
  const id = g.dataset.id;
  if (g.classList.contains('knob')) { drags.set(e.pointerId, { id, y: e.clientY, acc: 0 }); g.setPointerCapture(e.pointerId); g.classList.add('down'); return; }
  if (latched.has(id)) { latched.delete(id); g.classList.remove('latch'); press(id, 0); return; }
  if (e.shiftKey) { latched.add(id); g.classList.add('latch'); press(id, 1); return; }
  g.setPointerCapture(e.pointerId); drags.set(e.pointerId, { id, btn: true }); press(id, 1);
});
dev.addEventListener('pointermove', (e) => {
  const d = drags.get(e.pointerId); if (!d || d.btn) return;
  const k = 640 / dev.getBoundingClientRect().width;
  d.acc += (d.y - e.clientY) * k; d.y = e.clientY;
  const st = Math.trunc(d.acc / 7); if (st) { d.acc -= st * 7; turn(d.id, st); }
});
function suelta(e) {
  const d = drags.get(e.pointerId); if (!d) return; drags.delete(e.pointerId);
  if (d.btn) press(d.id, 0); else EL[d.id].classList.remove('down');
}
dev.addEventListener('pointerup', suelta); dev.addEventListener('pointercancel', suelta);
dev.addEventListener('wheel', (e) => {
  const g = e.target.closest('.knob'); if (!g) return;
  e.preventDefault(); turn(g.dataset.id, e.deltaY < 0 ? 1 : -1);
}, { passive: false });
dev.addEventListener('contextmenu', (e) => e.preventDefault());
// teclado de la computadora: espacio = PLAY, A..K = blancas 1..8, Q..I = blancas 9..16, Enter sobre un control enfocado
const KB = { a: 0, s: 1, d: 2, f: 3, g: 4, h: 5, j: 6, k: 7, q: 8, w: 9, e: 10, r: 11, t: 12, y: 13, u: 14, i: 15 };
const held = new Set();
function teclaId(e) {
  if (e.metaKey || e.ctrlKey || e.altKey || /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return null;
  if (e.code === 'Space') return 'play';
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.id && !e.target.classList.contains('knob')) return e.target.dataset.id;
  const k = (e.key || '').toLowerCase(); return k in KB ? 'w' + KB[k] : null;
}
document.addEventListener('keydown', (e) => {
  const id = teclaId(e); if (!id) return;
  e.preventDefault(); if (e.repeat || held.has(id)) return;
  if (!on) { encender(); return; }
  held.add(id); press(id, 1);
});
document.addEventListener('keyup', (e) => { const id = teclaId(e); if (!id || !held.has(id)) return; held.delete(id); press(id, 0); });
dev.addEventListener('keydown', (e) => {                       // flechas sobre una perilla enfocada
  const g = e.target.closest && e.target.closest('.knob'); if (!g) return;
  if (e.key === 'ArrowUp' || e.key === 'ArrowRight') { e.preventDefault(); turn(g.dataset.id, 1); }
  if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') { e.preventDefault(); turn(g.dataset.id, -1); }
});
window.addEventListener('blur', () => { for (const id of held) press(id, 0); held.clear(); });

/* ---------- arranque ---------- */
let l0 = 'es';
try { l0 = localStorage.getItem('fg-lang') || (navigator.language || 'es').slice(0, 2); } catch (e) {}
$('lang').addEventListener('change', (e) => applyLang(e.target.value));
applyLang(l0); applyTheme();
sctx.fillStyle = '#0B0B0A'; sctx.fillRect(0, 0, 240, 240);
</script>
