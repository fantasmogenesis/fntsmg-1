<style>
/* La caja manda: el aparato a todo lo ancho, al lado lo que hace cada control ahora mismo. Mismo sistema que las páginas de diseño. */
:root{

}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --paper:#111110; --paper-2:#1b1b19; --ink:#EDEAE3; --ink-2:#9a978f; --rule:#2d2c29; --cobalt:#7d93ff; --body:#1d1d1b; --bed:#242422; --part:#2c2c29; color-scheme:dark; }
}
:root[data-theme="dark"]{ --paper:#111110; --paper-2:#1b1b19; --ink:#EDEAE3; --ink-2:#9a978f; --rule:#2d2c29; --cobalt:#7d93ff; --body:#1d1d1b; --bed:#242422; --part:#2c2c29; color-scheme:dark; }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.page{max-width:1280px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:28px}
.eyebrow{font-weight:800;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}
h1{font-weight:200;font-size:clamp(36px,6vw,64px);letter-spacing:-.03em;line-height:.95;margin:6px 0 0}
h3{font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin:0}
p{margin:0}
.muted{color:var(--ink-2)}
.top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:end;justify-content:space-between}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font:800 11px var(--f);letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--ink);border-radius:999px;padding:10px 16px;background:var(--ink);color:var(--paper);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.key:focus-visible,.btnh:focus-visible,.knob:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
.status{font-size:13px;color:var(--ink-2)}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
@media (max-width:980px){ .stage{grid-template-columns:1fr} }

/* aparato */
.dev{position:relative;width:100%;max-width:100%;aspect-ratio:773/480;background:var(--body);border-radius:4.6%/7.4%;container-type:inline-size;user-select:none;-webkit-user-select:none;touch-action:none;box-shadow:0 22px 50px -26px rgba(0,0,0,.55)}
.abs{position:absolute;transform:translate(-50%,-50%)}
.panel{position:absolute;background:var(--bed);border-radius:1.4cqw}
.lbl{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100% + .6cqw);white-space:nowrap;font-weight:800;font-size:1.3cqw;letter-spacing:.06em;color:var(--silk);pointer-events:none}
.lbl.f{color:var(--tag)}
.knob{border-radius:50%;background:radial-gradient(circle at 40% 35%,#2b2b29,#0f0f0e 70%);box-shadow:0 .25cqw .6cqw rgba(0,0,0,.6),0 0 0 .15cqw #050505;cursor:ns-resize;border:0;padding:0}
.knob .ind{position:absolute;left:50%;top:50%;width:.36cqw;height:40%;margin-left:-.18cqw;background:#8a867d;transform-origin:50% 0;border-radius:.2cqw}
.knob.enc .ind{top:10%;height:22%;transform-origin:50% 182%}
.knob.act{box-shadow:0 0 0 .28cqw var(--tag),0 .25cqw .6cqw rgba(0,0,0,.6)}
.btnh{border-radius:.9cqw;background:var(--part);color:#a9a59c;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:1.15cqw;letter-spacing:.06em;line-height:1.05;box-shadow:0 .2cqw 0 #0a0a09;cursor:pointer;border:0;padding:0;font-family:var(--f)}

.btnh.l2{background:#3b3a36;color:var(--led);box-shadow:0 0 1.4cqw rgba(242,238,228,.22),0 .2cqw 0 #0a0a09}
.btnh.l3{animation:bbreath 1.1s ease-in-out infinite;color:var(--led)}
.btnh.rec{color:var(--rec)} .btnh.rec.l2{background:var(--rec);color:#fff}
.btnh.down{transform:translate(-50%,-50%) translateY(.15cqw);box-shadow:0 0 0 .22cqw var(--tag)}
@keyframes bbreath{0%,100%{background:var(--part)}50%{background:#4a4843}}
.key{border-radius:2.4cqw;background:#121211;box-shadow:0 0 0 .18cqw #2c2c29 inset;cursor:pointer;border:0;padding:0;font-family:var(--f)}
.key .slot{position:absolute;left:50%;top:10%;height:30%;width:24%;margin-left:-12%;border-radius:1cqw;background:#0a0a09;box-shadow:0 0 0 .14cqw #2a2a27 inset}
.key.l1 .slot{background:#3d3b37}
.key.l2 .slot{background:var(--led);box-shadow:0 0 1.2cqw rgba(242,238,228,.35)}

.key.l4 .slot{animation:blink .36s steps(1) infinite}
.key.down{box-shadow:0 0 0 .3cqw var(--tag) inset}
.key .t{position:absolute;left:0;right:0;bottom:8%;text-align:center;font-weight:800;font-size:1cqw;color:#8f8b83;line-height:1.05;pointer-events:none;padding:0 .2cqw}
.key .kb{position:absolute;left:0;right:0;top:44%;text-align:center;font-weight:600;font-size:.95cqw;color:#55524c;pointer-events:none}
@keyframes breath{0%,100%{background:#2a2926}50%{background:#c9c4b9}}
@keyframes blink{0%{background:var(--led)}50%{background:#2a2926}}
@media (prefers-reduced-motion:reduce){.key.l3 .slot,.key.l4 .slot{animation:none;background:#8a867d}.btnh.l3{animation:none;background:#3b3a36}}
.screen{position:absolute;background:var(--scr);border-radius:.6cqw;box-shadow:0 0 0 .5cqw #0d0d0c,0 0 0 .62cqw #2a2a27;overflow:hidden}
.screen canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.off-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#8f8b83;font-weight:800;font-size:1.3cqw;letter-spacing:.1em;padding:2cqw}

/* lado */
.side{display:grid;gap:18px;min-width:0}
.now h2{font-weight:200;font-size:30px;letter-spacing:-.02em;line-height:1;margin:6px 0 10px}
.rows{display:grid;gap:8px}
.rows div{display:grid;grid-template-columns:96px 1fr;gap:10px;font-size:13.5px;border-top:1px solid var(--rule);padding-top:8px}
.rows b{font-weight:800}
.keys{display:grid;gap:6px;font-size:12.5px;color:var(--ink-2)}
kbd{font:700 11px var(--f);border:1px solid var(--rule);border-radius:4px;padding:0 5px;background:var(--paper-2);color:var(--ink)}
.usb{display:grid;gap:10px;padding:16px;border-radius:12px;background:var(--paper-2)}
.usb .bar{gap:8px}
.usb canvas{width:100%;height:auto;border-radius:6px;background:#0b0b0a;display:block}
label.btn{display:inline-block}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.confirm{font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
</style>

function euclid(tr){ if(!tr.eu[0]) return; const n=tr.len, h=tr.eu[0], r=tr.eu[1]; for(let i=0;i<n;i++){ const j=((i-r)%n+n)%n; tr.steps[i]=h&&(j*h)%n<h?(tr.steps[i]===2?2:1):0; } }

    case 'play': if(!on){ power(); break; } U.playing=!U.playing; post({type:'play',on:U.playing}); if(!U.playing) U.pos.fill(-1); break;

function sendPerf(){ let flags=0; const seq={}; PERF.forEach(([id,,f])=>{ if(!U.perf.has(id)) return; if(f==='seq') seq[id]=1; else flags|=f; }); post({type:'perf',flags,seq}); }

function whitePress(i){
  if(held('fx')){ U.fxUsed=true; U.used.add('w'+i); const id=PERF[i][0]; if(U.latch.has(id)){ U.latch.delete(id); U.perf.delete(id); } else U.perf.add(id); U.hw.push(i); sendPerf(); render(); return; }

    if(held('b10')){ U.used.add('b10'); if(U.copySrc==null){ U.copySrc={pat:i}; showOv(L3('COPIA|COPY|CÓPIA'),PAT()+' '+(i+1),0); } else if(U.copySrc.pat!=null){ st.pats[i]=JSON.parse(JSON.stringify(st.pats[U.copySrc.pat])); post({type:'pats',pats:st.pats}); save(); showOv(L3('PEGADO|PASTED|COLADO'),PAT()+' '+(i+1),1); } render(); return; }
    U.homeList.push(i); showOv(U.homeList.length>1?L3('CADENA|CHAIN|CADEIA'):PAT(),U.homeList.map(x=>x+1).join(' › '),i/15); render(); return; }
  if(held('save')){ U.used.add('save'); const now=performance.now(), last=U.lastTap['s'+i]||0; U.lastTap['s'+i]=now;
    if(now-last<400&&store.get(SLOT(i),null)){ const d=store.get(SLOT(i),null); st=Object.assign(seed(),d); persist(); location.reload(); return; }
    store.set(SLOT(i),st); showOv(L3('GUARDADO EN|SAVED TO|SALVO NO'),L3('RANURA|SLOT|SLOT')+' '+(i+1),1); render(); return; }
  if(held('b10')){ U.used.add('b10'); const tr=TRK(), s=U.sp*16+i;
    if(U.copySrc==null||U.copySrc.step==null){ U.copySrc={step:{v:tr.steps[s],l:tr.locks[s],a:tr.auto[s],p:tr.props[s]}}; showOv(L3('COPIA|COPY|CÓPIA'),L3('PASO|STEP|PASSO')+' '+(s+1),0); }
    else { const c=U.copySrc.step; tr.steps[s]=c.v; tr.locks[s]=Object.assign({},c.l); tr.auto[s]=Object.assign({},c.a); tr.props[s]=Object.assign({},c.p); sendTrack(st.sel); showOv(L3('PEGADO|PASTED|COLADO'),L3('PASO|STEP|PASSO')+' '+(s+1),1); }
    render(); return; }
  if(!U.seq){ playNote(i); render(); return; }
  if(U.page==='env'&&!U.hw.length&&!held('arp')){ if(i<8){ U.mixT[i]=setTimeout(()=>{ U.mixT[i]=null; U.used.add('w'+i); toggleSolo(i); render(); },420); } render(); return; }
  U.hw.push(i); clearAcc(); render();
}
function whiteRelease(i){
  if(U.mixT[i]!==undefined){ const tm=U.mixT[i]; delete U.mixT[i]; if(tm!=null){ clearTimeout(tm); toggleMute(i); } U.used.delete('w'+i); render(); return; }
  const k=U.hw.indexOf(i); if(k>=0) U.hw.splice(k,1);
  if(held('fx')||U.perf.has(PERF[i][0])&&!U.latch.has(PERF[i][0])){ if(U.perf.has(PERF[i][0])&&!U.latch.has(PERF[i][0])){ U.perf.delete(PERF[i][0]); sendPerf(); } U.used.delete('w'+i); render(); return; }
  if(!U.seq){ U.used.delete('w'+i); render(); return; }
  if(k>=0&&!U.used.has('w'+i)&&!held('arp')&&!held('home')&&!held('save')&&!held('b10')){
    const tr=TRK(), s=U.sp*16+i; if(s<tr.len){ const now=performance.now(), last=U.lastTap['w'+s]||0; U.lastTap['w'+s]=now;

}
function playNote(i){

function sendMutes(now){ post({type:'mute',mute:U.mute.slice(),solo:U.solo.slice(),now}); }

/* ================= entrada: puntero (varios dedos) y teclado ================= */
const ptr=new Map();
dev.addEventListener('pointerdown',e=>{
  const el=e.target.closest('[data-id]'); if(!el) return; e.preventDefault(); const id=el.dataset.id;
  try{el.setPointerCapture(e.pointerId);}catch(_){}
  if(el.classList.contains('knob')){ ptr.set(e.pointerId,{id,y:e.clientY,acc:0,knob:true}); return; }
  const sticky=e.shiftKey&&/^(fx|home|save|arp|rec|w\d+|b8|b9|b10)$/.test(id);
  if(sticky&&U.down.has(id)){ release(id); return; }
  ptr.set(e.pointerId,{id,sticky}); press(id);
});
dev.addEventListener('pointermove',e=>{ const h=ptr.get(e.pointerId); if(!h||!h.knob) return; const dy=h.y-e.clientY; h.y=e.clientY; h.acc+=dy;
  const unit=h.id==='master'?2:3; while(Math.abs(h.acc)>=unit){ const d=Math.sign(h.acc); h.acc-=d*unit; knobStep(h.id,d); } });
const endPtr=e=>{ const h=ptr.get(e.pointerId); if(!h) return; ptr.delete(e.pointerId); if(!h.knob&&!h.sticky) release(h.id); };
dev.addEventListener('pointerup',endPtr); dev.addEventListener('pointercancel',endPtr);
let wheelAt=0;
dev.addEventListener('wheel',e=>{ const el=e.target.closest('.knob'); if(!el) return; e.preventDefault(); const d=e.deltaY<0?1:-1, id=el.dataset.id;
  if(id[0]==='k') turn(+id.slice(1),d*2); else if(id==='master') masterTurn(d*2); else { const n=performance.now(); if(n-wheelAt>110){ wheelAt=n; encoder(id,d); } } },{passive:false});
let encAcc={};
function knobStep(id,d){
  if(id==='master') return masterTurn(d);
  if(id[0]==='k') return turn(+id.slice(1),d);
  encAcc[id]=(encAcc[id]||0)+d; if(Math.abs(encAcc[id])>=3){ const s=Math.sign(encAcc[id]); encAcc[id]=0; encoder(id,s); }
}
const KEYMAP={Digit1:'b0',Digit2:'b1',Digit3:'b2',Digit4:'b3',Digit5:'b4',Digit6:'b5',Digit7:'b6',Digit8:'b7',Digit9:'b8',Digit0:'b9',Minus:'b10',
  KeyZ:'fx',KeyX:'scl',KeyC:'env',KeyV:'lfo',KeyB:'edit',KeyN:'glo',KeyM:'home',Comma:'save',Period:'arp',Slash:'seq',Space:'play',Enter:'rec',BracketLeft:'octm',BracketRight:'octp'};
'QWERTYUIASDFGHJK'.split('').forEach((c,i)=>KEYMAP['Key'+c]='w'+i);
addEventListener('keydown',e=>{ if(e.metaKey||e.ctrlKey||e.altKey) return; if(/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  const id=KEYMAP[e.code]; if(!id) { const ak={ArrowLeft:['select',-1],ArrowRight:['select',1],ArrowUp:['algorithm',1],ArrowDown:['algorithm',-1]}[e.key]; if(ak&&on){ e.preventDefault(); encoder(ak[0],ak[1]); } return; }
  e.preventDefault(); if(e.repeat) return; press(id); });
addEventListener('keyup',e=>{ const id=KEYMAP[e.code]; if(id) release(id); });
addEventListener('blur',()=>{ [...U.down].forEach(release); });

/* ================= audio ================= */
function defaultSample(){ const sr=22050, len=Math.round(sr*60/124*8), a=new Int16Array(len); let s=7; const rnd=()=>{ s=(s*1103515245+12345)>>>0; return s/4294967296*2-1; };
  const hits=[[0,'k'],[3,'h'],[4,'s'],[6,'k'],[8,'h'],[10,'k'],[12,'s'],[14,'h'],[16,'k'],[19,'k'],[20,'s'],[22,'h'],[24,'k'],[27,'h'],[28,'s'],[30,'s']], stp=sr*60/124/4;
